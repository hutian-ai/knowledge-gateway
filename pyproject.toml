[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "hutian-knowledge-gateway"
version = "0.1.0"
description = "Authorized document ingestion, versioned sources and retrieval through independent backends"
requires-python = ">=3.11"
license = "MIT"
readme = "README.md"
dependencies = ["fastapi==0.136.3", "httpx==0.28.1", "mcp==1.30.0", "pydantic==2.12.5", "uvicorn>=0.30,<1"]

[project.scripts]
knowledge-gateway-admin = "knowledge_gateway.admin:main"
knowledge-gateway = "knowledge_gateway.client:main"

[tool.setuptools.packages.find]
include = ["knowledge_gateway*"]
